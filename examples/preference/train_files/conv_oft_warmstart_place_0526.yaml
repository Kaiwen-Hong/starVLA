run_id: conv_oft_warmstart_place_0526
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl]
wandb_entity: kaiwenh-17-uiuc
wandb_project: pref-sim
is_debug: false

# QwenOFT (OpenVLA-OFT style: action-token query + L1 regression), warm-started
# from StarVLA/Qwen3-VL-OFT-RoboTwin2-All (steps_140000). 14D joint qpos, chunk 50.
# Framework block copied from examples/Robotwin/train_files/starvla_cotrain_robotwin_abs.yaml
# (the config the ckpt was trained with) so the pretrained weights load cleanly.
# Data swapped to our 0526 place via pref_hdf5 action_space=joint. VLM-cotrain dropped
# (action-only convergence check).

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: Qwen/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
    vl_hidden_dim: 2048   # overridden at runtime to model hidden (2560); kept for parity
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    future_action_window_size: 49
    action_horizon: 50
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 2560
      positional_embeddings: null


datasets:
  vla_data:
    dataset_py: pref_hdf5
    action_space: joint            # 14D qpos vector (matches OFT ckpt modality)
    data_root_dir: /mnt/localssd/kaiwenh/pref/data/0526/place
    data_mix: place_v1
    stats_json_path: examples/preference/dataset/stats_place_0526_joint.json
    pref_category: place
    action_type: abs_qpos
    future_action_window_size: 49
    past_action_window_size: 0
    include_state: false           # QwenOFT.forward does not consume state
    cameras: ["head_camera", "left_camera", "right_camera"]
    image_size: [224, 224]
    per_device_batch_size: 8
    num_workers: 4


trainer:
  epochs: 100
  max_train_steps: 1500
  num_warmup_steps: 150
  save_interval: 100000
  eval_interval: 100000
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 25
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  pretrained_checkpoint: /mnt/localssd/kaiwenh/cache/oft_ckpt/checkpoints/steps_140000_pytorch_model.pt

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
