run_id: pref_b0_stage_b_v1_place
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: kaiwenh-17-uiuc
wandb_project: pref-sim
is_debug: false


framework:
  # Stage B B0 (baseline): warm-start from NO-VQA Stage A baseline 35k,
  # continue-train on the SAME 100 contact taskB episodes BUT WITHOUT
  # the "Preference: ..." suffix (base prompt only) and WITHOUT pseudo-
  # label cache. Same framework, same hyperparams, same data, same
  # save_interval grid as main — only differences:
  #   - pretrained_checkpoint: no-VQA Stage A (vs VQA Stage A for main)
  #   - vla_data.with_pref_suffix: false (vs true for main)
  #   - vla_data.pseudo_label_cache: not set (vs cache JSON for main)
  # See r-preference/doc/0524-stageB-contact-plan.md §5.
  name: QwenPI
  qwenvl:
    base_vlm: Qwen/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
    vl_hidden_dim: 2560
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 20
    state_dim: 20
    future_action_window_size: 15
    action_horizon: 16
    past_action_window_size: 0
    repeated_diffusion_steps: 4
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

  reduce_in_full_precision: true


datasets:
  vla_data:
    dataset_py: pref_hdf5_stageb
    data_root_dir: /mnt/localssd/kaiwenh/pref/data/place/taskB
    data_mix: place_taskB_b0_v1
    stats_json_path: examples/preference/dataset/stats_place_v1.json
    pref_category: place
    task_groups: ["place_soap2_stand"]
    pref_keys: ["center", "corner"]
    split_val_fraction: 0.0

    # ==========================================================
    # B0: no cache, no pref suffix
    # ==========================================================
    # pseudo_label_cache: null                # B0 doesn't read cache
    with_pref_suffix: false                   # B0 mode: lang = base template only, NO "Preference: ..."

    action_type: abs_ee_6d
    future_action_window_size: 15
    past_action_window_size: 0
    include_state: true
    cameras: ["head_camera", "left_camera", "right_camera"]
    image_size: [224, 224]
    per_device_batch_size: 8
    num_workers: 4


trainer:
  # Warm-start from NO-VQA Stage A 35k (the ONLY available baseline ckpt — see §8.1 postmortem)
  pretrained_checkpoint: results/Checkpoints/pref_baseline_stage_a_v1_noVQA_place/checkpoints/steps_25000_pytorch_model.pt
  is_resume: false

  epochs: 100
  max_train_steps: 3000                     # same as main for clean comparison
  num_warmup_steps: 300                     # 0.1 × max_train_steps
  save_interval: 500                        # same grid as main: 500/1000/.../3000 + final = 7 ckpts
  eval_interval: 4000                       # > max → no step-eval

  learning_rate:
    base: 2.5e-06
    qwen_vl_interface: 1.0e-06
    action_model: 1.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-07

  freeze_modules: ''
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 50
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
