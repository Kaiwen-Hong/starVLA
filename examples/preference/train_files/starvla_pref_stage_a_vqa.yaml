run_id: pref_main_stage_a_v1_VQA
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: kaiwenh-17-uiuc
wandb_project: pref-sim
is_debug: false


framework:
  # MAIN-METHOD: L = L_action + lambda_vqa * L_vqa. Action stream is
  # byte-identical to baseline (Qwen_PI.forward), VQA is bolted on inside
  # Qwen_PI_VQA.forward and aggregated there. See QwenPI_VQA.py module
  # docstring for the spec map.
  name: QwenPI_VQA
  qwenvl:
    base_vlm: Qwen/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
    vl_hidden_dim: 2560   # Qwen3-VL-4B; framework overrides at runtime
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 20
    state_dim: 20
    future_action_window_size: 15
    action_horizon: 16
    past_action_window_size: 0
    repeated_diffusion_steps: 4
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      # Schema parity with baseline; runtime override in LayerwiseFM_ActionHeader
      # __init__ pins shape to (36 layers, hidden 2560, ~3.3B params).
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vqa:
    # Sweep lambda_vqa in {0.1, 0.3, 0.5, 1.0} (spec §6.1); 0.5 is the
    # starting point. If vqa_acc plateaus low or class-collapses (spec §7),
    # raise lambda.
    lambda_vqa: 0.5
    # Spec §2.3: deterministic take-first-2 unique episodes per batch.
    # 2:8 = 1:4 — the HIGH end of the 1:4 ~ 1:8 target ratio. Stronger VQA
    # signal early; lambda owns magnitude scaling, so 2 is a clean starting
    # point that's easy to sweep against.
    n_vqa_per_batch: 2
    num_frames: 8
    camera: head_camera

  reduce_in_full_precision: true


datasets:
  vla_data:
    dataset_py: pref_hdf5_vqa
    data_root_dir: /mnt/localssd/kaiwenh/pref/data/giveobj
    data_mix: giveobj_v1
    # Same stats JSON as baseline — DO NOT regenerate (split would shift).
    stats_json_path: examples/preference/dataset/stats_giveobj_v1.json
    action_type: abs_ee_6d
    future_action_window_size: 15
    past_action_window_size: 0
    include_state: true
    cameras: ["head_camera", "left_camera", "right_camera"]
    image_size: [224, 224]
    per_device_batch_size: 8
    num_workers: 4
    vqa_num_frames: 8
    vqa_camera: head_camera


trainer:
  epochs: 100
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  # NB: aggregation INSIDE Qwen_PI_VQA.forward. trainer reads only
  # output_dict["action_loss"] (which here = L_action + lambda_vqa * L_vqa).
  # `loss_scale.*` would be dead config — intentionally NOT set.
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  # H200 141GB has ~85 GB headroom over baseline H100 peak (56 GB), so we
  # can keep ckpt OFF even with the 8-frame VQA clip + LM head bwd.
  # If on H100 80GB, flip to true (cost ~8% throughput, recovers ~10 GB).
  enable_gradient_checkpointing: false
  enable_mixed_precision_training: true
