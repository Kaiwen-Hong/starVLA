# DEPRECATED 2026-05-23: this is the legacy giveobj baseline YAML, retained as
# the historical anchor matching the (now renamed) ckpt at
# results/Checkpoints/pref_baseline_stage_a_v1_noVQA_contact/. For fresh
# training prefer starvla_pref_stage_a_baseline_contact.yaml (byte-identical
# spec, uses the new `contact` category key + path). Re-launching this YAML
# would create a NEW empty ckpt dir at the legacy name, which is confusing.
run_id: pref_baseline_stage_a_v1_noVQA
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: kaiwenh-17-uiuc
wandb_project: pref-sim
is_debug: false


framework:
  name: QwenPI
  qwenvl:
    # Stage A spec: from Qwen3-VL-4B base, NO StarVLA action ckpt.
    base_vlm: Qwen/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
    vl_hidden_dim: 2560   # Qwen3-VL-4B text_config.hidden_size; framework overrides at runtime
  dino:
    dino_backbone: dinov2_vits14   # unused but kept for schema parity
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 20      # bimanual EE+6D rot = 2 * (3 + 6 + 1)
    state_dim: 20
    future_action_window_size: 15
    action_horizon: 16              # future_window + 1
    past_action_window_size: 0
    repeated_diffusion_steps: 4
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      # IMPORTANT: cross_attention_dim and num_layers below are OVERRIDDEN at
      # runtime by LayerwiseFlowmatchingActionHead.__init__ (lines 257-262):
      #   cross_attention_dim <- qwenvl.vl_hidden_dim (= 2560 for Qwen3-VL-4B)
      #   num_layers          <- qwenvl.num_vl_layers (= 36 for Qwen3-VL-4B)
      # The values here are kept for schema parity but DO NOT control the
      # actual DiT shape. Net result: layer-wise DiT-B with 36 cross-attn
      # blocks, hidden 2560, ~3.3B params -- expected given the backbone size,
      # NOT a misconfiguration. Memory budget: prefer 8x H100 (Zero2).
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

  reduce_in_full_precision: true


datasets:
  # NB: `vlm_data` is intentionally NOT defined here. `train_starvla.py:prepare_data`
  # only builds the VLA dataloader (line ~80-88); there is no VLM cotrain path
  # used by this script today, so a `vlm_data` block would be dead config.
  vla_data:
    dataset_py: pref_hdf5
    data_root_dir: /mnt/localssd/kaiwenh/pref/data/giveobj
    data_mix: giveobj_v1   # informational; pref_hdf5 bypasses mixtures.py
    stats_json_path: examples/preference/dataset/stats_giveobj_v1.json
    action_type: abs_ee_6d
    future_action_window_size: 15
    past_action_window_size: 0
    include_state: true
    cameras: ["head_camera", "left_camera", "right_camera"]
    image_size: [224, 224]
    per_device_batch_size: 8
    num_workers: 4
    # Ablation-cleanliness note: the prompt is assembled INSIDE pref_hdf5_dataset
    # (paraphrase stripped + ' Preference: low/high contact' suffix). DO NOT set
    # CoT_prompt here -- it would pre-pend an extra template and contaminate
    # the ablation against main-method.


trainer:
  epochs: 100
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 5000   # 10 checkpoints over 50k steps
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  # NB: train_starvla.py:_train_step uses `total_loss = action_loss` directly --
  # there is no `loss_scale.vla` multiplier wired in this script today. The
  # field is intentionally omitted; main-method must add its own `+ lambda * L_vqa`
  # term inside Qwen_PI.forward (NOT here) since the trainer only consumes a
  # scalar `action_loss` key.
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2   # 4 GPU * batch 8 * accum 2 = eff 64; halve to 1 for 8 GPU

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  # NB: Single-GPU benchmark showed grad_ckpt OFF was 8% faster (875 vs 953 ms,
  # peak 55 vs 45 GB). BUT in actual 8x H100 Zero2 + AdamW run, GPU 7 dropped
  # to 388 MB free with ckpt OFF -- Zero2 shards optim state UNEVENLY across
  # ranks (later ranks heavier) and the bench did not capture this. Turn ckpt
  # ON: per-step time ~1 s on benchmark, real multi-GPU step still 3-5 s due
  # to all-reduce of 7.79B params (the per-step cost is comm-bound, not
  # compute-bound, so the 8% ckpt OFF win does NOT materialise in distributed
  # training).
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
