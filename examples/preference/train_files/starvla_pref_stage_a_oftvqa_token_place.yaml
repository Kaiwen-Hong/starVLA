run_id: pref_oftvqa_token_stage_a_place
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: kaiwenh-17-uiuc
wandb_project: pref-sim
is_debug: false

# Stage A MAIN-METHOD (OFT backbone) with state-as-TOKEN VQA cotrain.
#   L = L1_action + lambda_vqa * L_vqa
# VQA state injected as a learned soft token (<|fim_pad|> marker, no embed resize)
# instead of numeric text — the text version collapsed to the recency prior on
# held-out (see r-preference/phase1/). phi (vqa_state_proj) trained at 1e-3.

framework:
  name: QwenOFT_VQA
  qwenvl:
    base_vlm: Qwen/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    future_action_window_size: 49
    action_horizon: 50
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 2560
      positional_embeddings: null
  vqa:
    category: place
    lambda_vqa: 0.5
    n_vqa_per_batch: 2
    state_mode: token

  reduce_in_full_precision: true


datasets:
  vla_data:
    dataset_py: pref_hdf5_vqa
    action_space: joint
    data_root_dir: /mnt/localssd/kaiwenh/pref/data/0526/place
    data_mix: place_v1
    stats_json_path: examples/preference/dataset/stats_place_0526_joint.json
    pref_category: place
    action_type: abs_qpos
    future_action_window_size: 49
    past_action_window_size: 0
    include_state: false
    cameras: ["head_camera", "left_camera", "right_camera"]
    image_size: [224, 224]
    per_device_batch_size: 8
    num_workers: 4


trainer:
  epochs: 100
  max_train_steps: 10000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 100000
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    vqa_state_proj: 1.0e-03
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 25
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  pretrained_checkpoint: /mnt/localssd/kaiwenh/cache/oft_ckpt/checkpoints/steps_140000_pytorch_model.pt

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
