# Discrete Diffusion Policy (MaskGIT-style) action head training config

run_id: starvla_discrete_diffusion
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false

framework:
  name: QwenDiscreteDiffusion
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen2.5-VL-3B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14

  action_model:
    # Discrete diffusion (MaskGIT-style, ref: ref_dd_mode.py)
    # 16-step chunks to match FastUMI, RoboTwin, etc. (action_indices = range(16))
    action_dim: 10
    state_dim: 10
    future_action_window_size: 15
    action_horizon: 16
    past_action_window_size: 0
    repeated_diffusion_steps: 4

    # Binning: 8 bits (2^8=256)
    # Naive bins representation (B,T,D,num_bins)
    num_bins: 256
    action_low: -1.0
    action_high: 1.0

    # MaskGIT schedule
    num_inference_steps: 8
    train_mask_schedule: cosine  # cosine or linear
    decode_schedule: cosine
    no_mask_token_prob: 0.0
    l1_loss_weight: 0.1  # Auxiliary L1 on continuous predictions
    inpainting_mask: false
    inpainting_d_schedule: linear_decay

    # Model
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 12
      attention_head_dim: 64
      num_attention_heads: 32
      output_dim: 256  # num_bins for (B,T,D,num_bins)
      positional_embeddings: "sinusoidal"

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    action_type: delta_qpos
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    image_size: [224, 224]
    video_backend: torchvision_av

trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 2.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: constant
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 1.0
  repeated_diffusion_steps: 4
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
